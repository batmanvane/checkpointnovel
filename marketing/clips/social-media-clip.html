<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>Checkpoint — Timeline Clip</title>
<style>
  @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('../../website/fonts/JetBrainsMono-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 700; font-display: swap; src: url('../../website/fonts/JetBrainsMono-Bold.woff2') format('woff2'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #c4c4d4;
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    width: 1080px;
    height: 1920px;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 1080px;
    height: 1920px;
  }

  #startBtn {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #d4a574;
    color: #1a1a2e;
    border: none;
    padding: 20px 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    cursor: pointer;
    z-index: 100;
    letter-spacing: 2px;
  }
  #startBtn:hover { opacity: 0.9; }
</style>
</head><body>

<canvas id="c" width="1080" height="1920"></canvas>
<button id="startBtn">START</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 1080, H = 1920;

const BG = '#1a1a2e';
const ACCENT = '#d4a574';
const DIM = '#b0b0d0';
const TEXT = '#f0f0ff';
const BLUE = '#8ab4e8';
const BORDER = '#3a3a5a';

// 60 seconds — social media length
const TOTAL_FRAMES = 66 * 60; // 66 seconds
let frame = 0;
let running = false;

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

// EEG generation — smooth
function generateEEG(x, t, style, seed) {
  const seedVal = seed + Math.floor(x * 0.05) * 73;
  const rng = mulberry32(seedVal);
  const rngVal = rng();

  if (style < 0) {
    const flatness = Math.min(1, -style);
    const drift = Math.sin(x * 0.003 + t * 0.2) * 1.5 * flatness;
    const emerging = (1 - flatness) * Math.sin(x * 0.04 + t * 2) * 8;
    return drift + emerging;
  }
  if (style < 0.3) {
    const s = style / 0.3;
    return Math.sin(x * 0.04 + t * 2) * 20
         + Math.sin(x * 0.12 + t * 5) * 8
         + Math.sin(x * 0.23 + rngVal * 100) * 8 * (1 - s * 0.5)
         + Math.sin(x * 0.005 + t * 0.3) * 10;
  } else if (style < 0.6) {
    const s = (style - 0.3) / 0.3;
    return Math.sin(x * 0.04 + t * 2) * (20 + s * 15)
         + Math.sin(x * 0.12 + t * 5) * (8 - s * 5)
         + Math.sin(x * 0.23 + rngVal * 100) * (6 - s * 5);
  } else if (style < 0.85) {
    const s = (style - 0.6) / 0.25;
    const perfect = Math.sin(x * 0.04 + t * 2) * 30;
    const variation = Math.sin(x * 0.04 + t * 2 + rngVal * (1 - s) * 2) * 30;
    return perfect * s + variation * (1 - s);
  } else {
    const s = (style - 0.85) / 0.15;
    return Math.sin(x * 0.04 + t * 2) * 30 * (1 - s)
         + Math.sin(x * 0.15 + t * 3 + rngVal * 20) * 15 * s * (1 - s * 0.7);
  }
}

// --- TIMING MODEL ---
// Milestones fade in and out at a fixed screen position.
// Each gets ~5.5s: 1s fade in, 3.5s hold, 1s fade out.

const milestones = [
  { t: 2,  year: '1924', label: 'Jena, Germany',      sub: 'Hans Berger connects electrodes\nto an open skull.', eeg: -1 },
  { t: 8,  year: '1929', label: 'First publication',   sub: 'Alpha waves.\n10 cycles per second.\nNo one believes him.', eeg: 0.1 },
  { t: 14, year: '2021', label: 'First BCI trials',    sub: 'Reading the brain\nis no longer enough.', eeg: 0.2 },
  { t: 20, year: '2031', label: 'CortexLink MK-I',     sub: 'A skin-colored patch\nbehind the left ear.\nIt reads. It also writes.', eeg: 0.35 },
  { t: 26, year: '2035', label: '100 million users',   sub: 'The updates are seamless.\nYou barely notice them.', eeg: 0.5 },
  { t: 32, year: '2038', label: '500 million',          sub: 'You barely notice the updates.\nBut the updates notice you.', eeg: 0.7 },
  { t: 38, year: '2041', label: '900 million',          sub: 'The thoughts come cleaner now.\nMore efficient. More... similar.', eeg: 0.85 },
  { t: 44, year: '',     label: '',                      sub: '', question: true, eeg: 0.95 },
  { t: 50, year: '',     label: '',                      sub: '', cliffhanger: true, eeg: 0.98 },
  { t: 55, year: '',     label: '',                      sub: '', convergence: true, eeg: 1.0 },
  { t: 60, year: '',     label: '',                      sub: '', title: true, eeg: 1.0 },
];

const FADE_IN = 1.0;   // seconds to fade in
const FADE_OUT = 1.0;  // seconds to fade out
const TEXT_Y = 200; // fixed vertical position for text (overlaid on EEG band)

// Convergence lines
const convLines = [];
for (let i = 0; i < 40; i++) {
  const startX = 100 + (i / 40) * 880;
  convLines.push({
    startX,
    exitAngle: (mulberry32(i * 200)() - 0.5) * Math.PI * 0.7,
    speed: 0.3 + mulberry32(i * 300)() * 0.7,
    waveFreq: 2 + mulberry32(i * 400)() * 4,
    waveAmp: 2 + mulberry32(i * 500)() * 10,
    hue: (startX / W) * 40 + 20,
    opacity: 0.25 + mulberry32(i * 600)() * 0.3
  });
}

// Get milestone opacity based on current time
function getMilestoneOpacity(m, time) {
  const nextIdx = milestones.indexOf(m) + 1;
  const duration = nextIdx < milestones.length ? milestones[nextIdx].t - m.t : 6;
  const holdEnd = m.t + duration - FADE_OUT;
  if (time < m.t) return 0;
  if (time < m.t + FADE_IN) return (time - m.t) / FADE_IN; // fade in
  if (time < holdEnd) return 1; // hold
  if (time < m.t + duration) return 1 - (time - holdEnd) / FADE_OUT; // fade out
  return 0;
}

// EEG style interpolated by time
function getCurrentEEGStyle(time) {
  for (let i = 0; i < milestones.length - 1; i++) {
    if (time <= milestones[i + 1].t) {
      const t = (time - milestones[i].t) / (milestones[i + 1].t - milestones[i].t);
      return milestones[i].eeg + (milestones[i + 1].eeg - milestones[i].eeg) * Math.max(0, Math.min(1, t));
    }
  }
  return 1.0;
}

// User count interpolated by time (2031=20s to 2041=38s)
function getUserCount(time) {
  if (time < 20) return 0;
  if (time > 38) return 900000000;
  return Math.floor(((time - 20) / 18) * 900000000);
}

// Year counter — interpolated by time between year-milestones
function getCurrentYear(time) {
  const ym = milestones.filter(m => m.year).map(m => ({ t: m.t, year: parseInt(m.year) }));
  if (ym.length === 0 || time < ym[0].t - 1) return null;

  for (let i = 0; i < ym.length; i++) {
    const m = ym[i];
    // Near a milestone — hold year
    if (time >= m.t - 1 && time <= m.t + 3) return m.year;
    // Between milestones — interpolate
    if (i < ym.length - 1) {
      const next = ym[i + 1];
      if (time > m.t + 3 && time < next.t - 1) {
        const t = (time - (m.t + 3)) / ((next.t - 1) - (m.t + 3));
        return Math.round(m.year + (next.year - m.year) * t);
      }
    }
  }
  return ym[ym.length - 1].year;
}

function drawFrame() {
  const time = frame / 60;
  const eegStyle = getCurrentEEGStyle(time);

  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  // --- Year counter (top-left) ---
  const currentYear = getCurrentYear(time);
  if (currentYear !== null && time < 44) {
    const isFuture = currentYear >= 2027;
    let yearOpacity = 0.85;

    if (isFuture) {
      const futureDepth = Math.min(1, (currentYear - 2027) / 14);
      const flickerSeed = Math.sin(frame * 0.37) * Math.cos(frame * 0.53);
      if (flickerSeed > 0.88 - futureDepth * 0.2) {
        yearOpacity = 0.35 + Math.abs(flickerSeed) * 0.3;
      }
    }

    ctx.font = 'bold 36px "JetBrains Mono"';
    ctx.fillStyle = isFuture ? ACCENT : TEXT;
    ctx.globalAlpha = yearOpacity;
    ctx.textAlign = 'left';
    ctx.fillText(String(currentYear), 80, 80);
    ctx.globalAlpha = 1;
  }

  // --- EEG traces ---
  const eegBandTop = 140;
  const eegBandHeight = 350;
  const numTraces = 4;
  const traceSpacing = eegBandHeight / (numTraces + 1);

  let eegOpacity = time < 55 ? 1 : Math.max(0, 1 - (time - 55) / 3);

  // Impulse sweep (first few seconds)
  const sweepProgress = Math.min(1, Math.max(0, (time - 1) / 5));

  if (eegOpacity > 0) {
    for (let tr = 0; tr < numTraces; tr++) {
      const baseY = eegBandTop + (tr + 1) * traceSpacing;
      ctx.beginPath();
      const isMain = tr === 1;
      ctx.strokeStyle = isMain ? ACCENT : BLUE;
      ctx.globalAlpha = eegOpacity * (isMain ? 0.8 : 0.4);
      ctx.lineWidth = isMain ? 2 : 1.2;

      const trDelay = tr * 0.08;
      const trSweep = Math.min(1, Math.max(0, (sweepProgress - trDelay) / (1 - trDelay)));

      for (let x = 60; x < W - 60; x += 2) {
        const xNorm = 1 - (x - 60) / (W - 120);
        const edge = trSweep * 1.3;
        const dist = Math.max(0, Math.min(1, (edge - xNorm) * 3));
        const blend = dist * dist * (3 - 2 * dist);
        const eegVal = generateEEG(x + tr * 300, time, eegStyle, tr * 1000 + 500);
        const y = baseY + eegVal * blend;
        if (x === 60) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    ctx.strokeStyle = BORDER;
    ctx.globalAlpha = eegOpacity * 0.3;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(60, eegBandTop + eegBandHeight + 20);
    ctx.lineTo(W - 60, eegBandTop + eegBandHeight + 20);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // --- Timeline rail (visible during year milestones) ---
  const railX = 160;
  const railTop = 560;
  const railBottom = 1800;

  if (time > 1 && time < 44) {
    const railFadeIn = Math.min(0.25, (time - 1) / 4);
    const railFadeOut = time > 40 ? Math.max(0, 1 - (time - 40) / 4) : 1;
    ctx.strokeStyle = BORDER;
    ctx.globalAlpha = railFadeIn * railFadeOut;
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 8]);
    ctx.beginPath();
    ctx.moveTo(railX, railTop);
    ctx.lineTo(railX, railBottom);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  // --- Milestone content (fade in/out at fixed position) ---
  const textX = 220;
  const textPad = 16; // padding around text background

  // Draw a semi-transparent background behind text
  function drawTextBG(x, y, w, h, alpha) {
    ctx.fillStyle = 'rgba(26, 26, 46, 0.75)'; // BG color with transparency
    ctx.globalAlpha = alpha;
    ctx.fillRect(x - textPad, y - textPad, w + textPad * 2, h + textPad * 2);
  }

  for (const m of milestones) {
    const opacity = getMilestoneOpacity(m, time);
    if (opacity < 0.01) continue;

    // Smooth the opacity with an ease curve
    const easedOpacity = opacity * opacity * (3 - 2 * opacity);
    ctx.textAlign = 'left';

    if (m.question) {
      drawTextBG(textX, TEXT_Y - 26, 620, 70, easedOpacity);
      ctx.globalAlpha = easedOpacity;
      ctx.font = '26px "JetBrains Mono"';
      ctx.fillStyle = TEXT;
      ctx.fillText('Where does the patch stop', textX, TEXT_Y);
      ctx.fillStyle = ACCENT;
      ctx.fillText('and the you begin?', textX, TEXT_Y + 44);
    }
    else if (m.cliffhanger) {
      drawTextBG(textX, TEXT_Y - 22, 600, 66, easedOpacity);
      ctx.globalAlpha = easedOpacity;
      ctx.font = '22px "JetBrains Mono"';
      ctx.fillStyle = DIM;
      ctx.fillText('Four people find out.', textX, TEXT_Y);
      ctx.fillStyle = TEXT;
      ctx.fillText('Not all of them wanted to.', textX, TEXT_Y + 44);
    }
    else if (m.convergence) {
      // convergence lines drawn separately
    }
    else if (m.title) {
      drawTextBG(W / 2 - 320, 280 - 50, 640, 340, easedOpacity);
      ctx.globalAlpha = easedOpacity;
      ctx.textAlign = 'center';
      const titleBaseY = 280;

      ctx.font = 'bold 64px "JetBrains Mono"';
      ctx.fillStyle = ACCENT;
      ctx.fillText('CHECKPOINT', W / 2, titleBaseY);

      ctx.font = '20px "JetBrains Mono"';
      ctx.fillStyle = DIM;
      ctx.fillText('A Novel.', W / 2, titleBaseY + 50);

      ctx.font = '22px "JetBrains Mono"';
      ctx.fillStyle = DIM;
      ctx.fillText('How we optimized into the void.', W / 2, titleBaseY + 110);

      ctx.font = '20px "JetBrains Mono"';
      ctx.fillStyle = TEXT;
      ctx.fillText('checkpoin.de', W / 2, titleBaseY + 190);

      ctx.font = '16px "JetBrains Mono"';
      ctx.fillStyle = DIM;
      ctx.fillText('Free under CC BY-NC-SA 4.0', W / 2, titleBaseY + 240);

      ctx.font = '14px "JetBrains Mono"';
      ctx.fillStyle = DIM;
      ctx.fillText('Music: "Ambient Piano" by Light Cut', W / 2, titleBaseY + 290);
    }
    else {
      // Standard milestone: label + sub at fixed position
      const numLines = m.sub ? m.sub.split('\n').length : 0;
      const blockH = 30 + numLines * 32;
      drawTextBG(textX, TEXT_Y - 26, 700, blockH, easedOpacity);
      ctx.globalAlpha = easedOpacity;
      if (m.label) {
        ctx.font = 'bold 26px "JetBrains Mono"';
        ctx.fillStyle = TEXT;
        ctx.fillText(m.label, textX, TEXT_Y);
      }
      if (m.sub) {
        ctx.font = '20px "JetBrains Mono"';
        ctx.fillStyle = DIM;
        const lines = m.sub.split('\n');
        lines.forEach((line, idx) => {
          ctx.fillText(line, textX, TEXT_Y + 40 + idx * 32);
        });
      }
    }
  }
  ctx.globalAlpha = 1;

  // --- User count ---
  const count = getUserCount(time);
  if (count > 0 && time < 44) {
    const countFade = Math.min(1, count / 50000000) * (time > 40 ? Math.max(0, 1 - (time - 40) / 4) : 1);
    if (countFade > 0) {
      ctx.font = '16px "JetBrains Mono"';
      ctx.fillStyle = DIM;
      ctx.globalAlpha = countFade * 0.7;
      ctx.textAlign = 'right';
      ctx.fillText(count.toLocaleString() + ' connected', W - 80, H - 80);
      ctx.globalAlpha = 1;
    }
  }
}

function drawConvergence(opacity, time) {
  const cx = W / 2, cy = H * 0.6;
  const convT = milestones[milestones.length - 2].t; // convergence milestone time
  const convProgress = Math.min(1, Math.max(0, (time - convT + 1) / 8));

  if (convProgress <= 0) return;

  for (const line of convLines) {
    const rng = mulberry32(Math.floor(line.startX) * 137);
    ctx.beginPath();
    ctx.strokeStyle = `hsl(${line.hue}, 55%, 70%)`;
    ctx.globalAlpha = opacity * line.opacity * Math.min(1, convProgress * 2);
    ctx.lineWidth = 1.2;

    const steps = 80;
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      if (t > Math.min(1, convProgress * 1.5)) break;

      let x, y;
      if (t < 0.5) {
        const ct = t / 0.5;
        const pull = ct * ct * ct;
        x = line.startX + (cx - line.startX) * pull;
        y = cy - 350 + ct * 350;
        x += (rng() - 0.5) * 15 * (1 - ct);
      } else {
        const wt = (t - 0.5) / 0.5;
        x = cx + Math.sin(line.exitAngle) * wt * wt * 400 * line.speed
            + Math.sin(wt * line.waveFreq * Math.PI * 2) * line.waveAmp * wt;
        y = cy + wt * 400;
      }

      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  if (convProgress > 0.25) {
    ctx.beginPath();
    ctx.arc(cx, cy, 3, 0, Math.PI * 2);
    ctx.fillStyle = ACCENT;
    ctx.globalAlpha = opacity * Math.min(1, (convProgress - 0.25) * 3);
    ctx.fill();
  }
}

function animate() {
  if (!running) return;
  const time = frame / 60;
  drawFrame();
  // Draw convergence lines during convergence + title milestones
  if (time > 53) {
    const convOpacity = Math.min(1, (time - 53) / 2);
    drawConvergence(convOpacity, time);
  }
  frame++;
  if (frame <= TOTAL_FRAMES) {
    requestAnimationFrame(animate);
  } else {
    running = false;
  }
}

document.getElementById('startBtn').addEventListener('click', function() {
  this.style.display = 'none';
  frame = 0;
  running = true;
  animate();
});

document.addEventListener('keydown', function(e) {
  if (e.code === 'Space') {
    document.getElementById('startBtn').style.display = 'none';
    frame = 0;
    running = true;
    animate();
  }
});
</script>
</body></html>
